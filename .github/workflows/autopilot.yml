# Autopilot Kopi Kita: pemeriksaan keamanan & kualitas otomatis setiap PR, setiap hari, dan manual.
# - Semua pemindaian aktif (ZAP) menyasar aplikasi di localhost runner dengan database Postgres
#   kontainer CI, bukan Vercel/production. Lighthouse memakai Neon branch "ci" khusus CI.
# - Tidak ada secret di file ini. Secret sementara (JWT, password seed) dibuat acak per run;
#   connection string Neon branch "ci" dibaca dari GitHub Secret CI_DATABASE_URL.
# - Action pihak ketiga dikunci ke commit SHA.
name: autopilot

on:
  pull_request:
  schedule:
    - cron: "0 23 * * *" # setiap hari 06:00 WIB
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autopilot-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  supply-chain:
    name: npm audit + gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks memindai seluruh riwayat Git
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: npm audit (gagal bila ada temuan critical)
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); const v=a.metadata.vulnerabilities; console.log('npm audit:', JSON.stringify(v)); require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### npm audit\n' + Object.entries(v).map(([k,n]) => '- ' + k + ': ' + n).join('\n') + '\n');"
          npm audit --audit-level=critical

      - name: gitleaks (riwayat Git lengkap)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks" && cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${file}\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" git -v --redact --no-banner --exit-code 1 .
          echo "### gitleaks: no leaks found" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: ignore

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.180.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep (p/default + p/owasp-top-ten, gagal bila ada temuan)
        run: semgrep scan --config p/default --config p/owasp-top-ten --metrics=off --error --text --json-output=semgrep.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep
          path: semgrep.json
          if-no-files-found: ignore

  zap-baseline:
    name: ZAP baseline (localhost + Postgres CI)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kopikita
          POSTGRES_USER: kopikita
          # Database sekali pakai di runner, hanya bisa diakses dari job ini: tanpa password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kopikita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: kopikita
      DB_NAME: kopikita
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: JWT_SECRET acak khusus run ini
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Skema + data contoh ke Postgres kontainer
        run: npm run db:migrate && npm run db:seed

      - run: npm run build

      - name: Jalankan aplikasi di localhost:3000
        run: |
          nohup npm run start -- -p 3000 > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
          curl -sf http://localhost:3000/api/health

      - name: ZAP baseline ke http://localhost:3000
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline

      - name: Log aplikasi
        if: always()
        run: tail -n 50 "$RUNNER_TEMP/app.log" || true

  quality:
    name: Lighthouse (Neon branch ci)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Connection string Neon branch "ci" (khusus CI, bukan production), disimpan sebagai GitHub Secret.
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pastikan secret Neon branch ci tersedia
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret CI_DATABASE_URL (connection string Neon branch ci) belum diisi di Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Secret acak khusus run ini
        run: |
          jwt="$(openssl rand -hex 32)"; seed="$(openssl rand -hex 16)"
          echo "::add-mask::$jwt"; echo "::add-mask::$seed"
          echo "JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "ADMIN_SEED_PASSWORD=$seed" >> "$GITHUB_ENV"

      - name: Skema + data contoh ke Neon branch ci
        run: npm run db:migrate && npm run db:seed

      - run: npm run build

      - name: Lighthouse CI (/, /menu, /booking)
        run: npx --yes @lhci/cli@0.15.1 autorun

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
